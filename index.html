<!doctype html>
<html>
  <head>
    <title>Pig Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="players-box">
      <div class="player player--active">
        <div class="player-details">
          <p class="player-name">Player 1</p>
          <p class="player-score">0</p>
        </div>
        <div class="current-score-box">
          <p class="current-label">current</p>
          <p class="current-score">0</p>
        </div>
      </div>
      <div class="player">
        <div class="player-details">
          <p class="player-name">Player 2</p>
          <p class="player-score">0</p>
        </div>
        <div class="current-score-box">
          <p class="current-label">current</p>
          <p class="current-score">0</p>
        </div>
      </div>
      <button class="btn btn--new"><span class="icon">🔁</span> New Game</button>
      <button class="btn btn--roll"><span class="icon">🎲</span> Roll Dice</button>
      <button class="btn btn--hold"><span class="icon">📥</span> Hold</button>
      <img src="img/dice-1.png" alt="a dice having 1" class="dice-img dice-img-1 hidden" />
      <img src="img/dice-2.png" alt="a dice having 2" class="dice-img dice-img-2 hidden" />
      <img src="img/dice-3.png" alt="a dice having 3" class="dice-img dice-img-3 hidden" />
      <img src="img/dice-4.png" alt="a dice having 4" class="dice-img dice-img-4 hidden" />
      <img src="img/dice-5.png" alt="a dice having 5" class="dice-img dice-img-5 hidden" />
      <img src="img/dice-6.png" alt="a dice having 6" class="dice-img dice-img-6 hidden" />
    </main>
    <script src="script.js"></script>
  </body>
</html>
